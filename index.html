<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Slice</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    cursor:none;
    background:#111;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}


/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    top:15px;
    left:20px;
    right:20px;
    z-index:5;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
    color:white;
}

#score{
    font-size:36px;
    font-weight:bold;
    text-shadow:0 3px 8px black;
}

#best{
    font-size:16px;
    opacity:.85;
    text-shadow:0 2px 5px black;
}

#lives{
    font-size:28px;
    letter-spacing:3px;
}


/* =========================
   COMBO
========================= */

#combo{
    position:fixed;
    left:50%;
    top:105px;

    transform:translateX(-50%) scale(.5);

    opacity:0;

    color:white;
    font-size:42px;
    font-weight:bold;
    font-style:italic;

    text-shadow:
        0 0 10px #ffb300,
        0 4px 10px black;

    pointer-events:none;
    z-index:10;

    transition:
        opacity .12s,
        transform .12s;
}

#combo.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
}


/* =========================
   OVERLAYS
========================= */

.overlay{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle at center,
            rgba(40,40,40,.3),
            rgba(0,0,0,.88)
        );

    color:white;

    z-index:20;

    text-align:center;
}

.hidden{
    display:none !important;
}


/* =========================
   LOGO
========================= */

.logo{
    font-size:clamp(48px,8vw,82px);
    font-weight:900;
    font-style:italic;
    letter-spacing:-5px;

    text-shadow:
        0 5px 0 #7a2600,
        0 0 25px #ff8c00;
}

.subtitle{
    font-size:18px;
    opacity:.8;
    margin-top:-5px;
}


/* =========================
   BUTTONS
========================= */

button{
    border:0;
    border-radius:12px;

    padding:14px 38px;

    margin-top:18px;

    font-size:20px;
    font-weight:bold;

    color:#321700;

    background:
        linear-gradient(
            #ffd83d,
            #ff941c
        );

    box-shadow:
        0 5px 15px rgba(0,0,0,.5);

    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

.secondary{
    background:
        linear-gradient(
            #eee,
            #aaa
        );
}


/* =========================
   SETTINGS
========================= */

#settingsScreen{
    position:fixed;
    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.88);

    /* FIX: normal cursor is always visible */
    cursor:auto;
}

#settingsScreen,
#settingsScreen *{
    /* FIX: cursor stays visible everywhere */
    cursor:auto;
}


/* SETTINGS BOX */

.panel{
    position:relative;

    width:min(520px,90vw);
    max-height:90vh;

    overflow-y:auto;

    padding:32px;

    border-radius:18px;

    background:
        linear-gradient(
            rgba(30,30,30,.98),
            rgba(15,15,15,.98)
        );

    box-shadow:
        0 15px 50px rgba(0,0,0,.8);

    border:
        1px solid rgba(255,255,255,.12);
}


/* SETTINGS X */

.closeSettingsX{

    position:absolute;

    top:12px;
    right:15px;

    width:42px;
    height:42px;

    margin:0;

    padding:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;

    color:white;

    background:
        rgba(255,255,255,.1);

    box-shadow:none;

}

.closeSettingsX:hover{

    background:
        rgba(255,70,70,.8);

    transform:scale(1.08);

}


.panel h2{
    margin-top:0;
    font-size:32px;
    text-align:center;
}

.setting{
    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:13px 0;

    border-bottom:
        1px solid rgba(255,255,255,.1);

    font-size:17px;
}

input[type="range"]{
    width:150px;
}

input[type="checkbox"]{
    width:21px;
    height:21px;
}


/* =========================
   PAUSE
========================= */

.pauseTitle{
    font-size:clamp(48px,8vw,70px);
    font-weight:bold;
}


/* =========================
   GAME OVER
========================= */

.gameOverTitle{
    font-size:clamp(48px,8vw,70px);
    color:white;

    text-shadow:
        0 0 25px #f22;
}

.finalScore{
    font-size:27px;
}

.newBest{
    color:#ffd83d;
    font-size:23px;
    font-weight:bold;
}

</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- =========================
     HUD
========================= -->

<div id="hud">

        </div>

<!-- =========================

        </div>


        <div class="setting">

            <input
                id="musicToggle"

            >

        </div>


        <div class="setting">

            <span>
                Master Volume
            </span>

            <input
                id="volume"
                type="range"
                min="0"

<!-- =========================
     GAME OVER
========================= -->

<div
    id="gameOver"
    class="overlay hidden"
>

    <div class="gameOverTitle">

    </div>

    <div

    >

    </div>

    >

    </div>

        id="gameOverSettings"

        SETTINGS

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W =
    window.innerWidth;

let H =
    window.innerHeight;


function resizeCanvas(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W;

    canvas.height =
        H;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   SCREEN SCALE
========================================================= */

function screenScale(){

    const baseHeight =
        900;

    return Math.min(
        1,
        H / baseHeight
    );

}


/* =========================================================
   SETTINGS
========================================================= */

const settings = {

    sound:true,
    music:true,
    volume:.70,
    trail:true,
    particles:true,
    shake:true

};


const soundToggle =
    document.getElementById(
        "soundToggle"
    );

const musicToggle =
    document.getElementById(
        "musicToggle"
    );

const volumeSlider =
    document.getElementById(
        "volume"
    );

const trailToggle =
    document.getElementById(
        "trailToggle"
    );

const particlesToggle =
    document.getElementById(
        "particlesToggle"
    );

const shakeToggle =
    document.getElementById(
        "shakeToggle"
    );


function loadSettings(){

    const saved =
        JSON.parse(
            localStorage.getItem(
                "fruitSliceSettings"
            ) || "null"
        );

    if(!saved)
        return;

    Object.assign(
        settings,
        saved
    );

    soundToggle.checked =
        settings.sound;

    musicToggle.checked =
        settings.music;

    volumeSlider.value =
        settings.volume * 100;

    trailToggle.checked =
        settings.trail;

    particlesToggle.checked =
        settings.particles;

    shakeToggle.checked =
        settings.shake;

}


function saveSettings(){

    localStorage.setItem(
        "fruitSliceSettings",
        JSON.stringify(settings)
    );

}

loadSettings();


soundToggle.onchange =
    () => {

        settings.sound =
            soundToggle.checked;

        saveSettings();

    };


musicToggle.onchange =
    () => {

        settings.music =
            musicToggle.checked;

        saveSettings();

    };


volumeSlider.oninput =
    () => {

        settings.volume =
            volumeSlider.value / 100;

        saveSettings();

    };


trailToggle.onchange =
    () => {

        settings.trail =
            trailToggle.checked;

        saveSettings();

    };


particlesToggle.onchange =
    () => {

        settings.particles =
            particlesToggle.checked;

        saveSettings();

    };


shakeToggle.onchange =
    () => {

        settings.shake =
            shakeToggle.checked;

        saveSettings();

    };


/* =========================================================
   AUDIO
========================================================= */

let audioContext =
    null;


function initAudio(){

    if(!audioContext){

        audioContext =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


function sound(
    frequency,
    duration,
    type="sine",
    volume=.08
){

    if(!settings.sound)
        return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume *
        settings.volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        duration
    );

    oscillator.connect(
        gain
    );

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


function sliceSound(){

    sound(
        600 +
        Math.random()*500,
        .07,
        "triangle",
        .06
    );

}


function bombSound(){

    sound(
        80,
        .45,
        "sawtooth",
        .18
    );

}


/* =========================================================
   GAME VARIABLES
========================================================= */

let state =
    "menu";

let score =
    0;

let lives =
    3;

let best =
    Number(
        localStorage.getItem(
            "fruitSliceBest"
        )
    ) || 0;

let fruits = [];

let pieces = [];

let particles = [];

let blade = [];

let spawnTimer =
    0;

let combo =
    0;

let comboTimer =
    0;

let shake =
    0;

let lastTime =
    performance.now();


document.getElementById(
    "best"
).textContent =
    "BEST " + best;


/* =========================================================
   FRUITS
========================================================= */

const fruitData = [

    {
        emoji:"🍎",
        color:"#ef3340"
    },

    {
        emoji:"🍊",
        color:"#ff8c00"
    },

    {
        emoji:"🍋",
        color:"#ffe13b"
    },

    {
        emoji:"🍉",
        color:"#35b94a"
    },

    {
        emoji:"🍇",
        color:"#8e44ad"
    },

    {
        emoji:"🍍",
        color:"#e8bd35"
    },

    {
        emoji:"🍑",
        color:"#ff9671"
    },

    {
        emoji:"🥝",
        color:"#78a832"
    }

];


function random(
    min,
    max
){

    return min +
        Math.random() *
        (max-min);

}


/* =========================================================
   FRUIT CLASS
========================================================= */

class Fruit{

    constructor(){

        const scale =
            screenScale();

        this.data =
            fruitData[
                Math.floor(
                    Math.random() *
                    fruitData.length
                )
            ];

        this.radius =
            random(
                32,
                45
            );

        this.x =
            random(
                W*.12,
                W*.88
            );

        this.y =
            H +
            this.radius*2;


        const arc =
            Math.random();

        let launch;


        if(
            arc < .20
        ){

            launch =
                random(
                    12,
                    15
                );

        }
        else if(
            arc < .50
        ){

            launch =
                random(
                    15,
                    18
                );

        }
        else if(
            arc < .82
        ){

            launch =
                random(
                    18,
                    21
                );

        }
        else{

            launch =
                random(
                    21,
                    24
                );

        }


        this.vy =
            -launch *
            scale;

        this.vy =
            Math.min(
                this.vy,
                -11
            );


        this.vx =
            random(
                -5.5,
                5.5
            ) *
            scale;


        this.gravity =
            random(
                .20,
                .27
            ) *
            scale;


        this.rotation =
            random(
                0,
                Math.PI*2
            );

        this.rotationSpeed =
            random(
                -.08,
                .08
            );

    }


    update(dt){

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            this.gravity *
            dt;

        this.rotation +=
            this.rotationSpeed *
            dt;


        if(
            this.x <
            this.radius
        ){

            this.x =
                this.radius;

            this.vx =
                Math.abs(
                    this.vx
                );

        }


        if(
            this.x >
            W-this.radius
        ){

            this.x =
                W-this.radius;

            this.vx =
                -Math.abs(
                    this.vx
                );

        }

    }


    draw(){

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.rotation
        );

        ctx.shadowColor =
            "rgba(0,0,0,.45)";

        ctx.shadowBlur =
            12;

        ctx.shadowOffsetY =
            7;

        ctx.font =
            `${this.radius*2}px Arial`;

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            this.data.emoji,
            0,
            0
        );

        ctx.restore();

    }

}


/* =========================================================
   BOMB
========================================================= */

class Bomb{

    constructor(){

        const scale =
            screenScale();

        this.radius =
            random(
                34,
                43
            );

        this.x =
            random(
                W*.12,
                W*.88
            );

        this.y =
            H+80;

        this.vy =
            -random(
                16,
                20
            ) *
            scale;

        this.vy =
            Math.min(
                this.vy,
                -11
            );

        this.vx =
            random(
                -5,
                5
            ) *
            scale;

        this.gravity =
            .24 *
            scale;

        this.rotation =
            random(
                0,
                Math.PI*2
            );

        this.rotationSpeed =
            random(
                -.07,
                .07
            );

    }


    update(dt){

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            this.gravity *
            dt;

        this.rotation +=
            this.rotationSpeed *
            dt;


        if(
            this.x <
            this.radius
        ){

            this.x =
                this.radius;

            this.vx =
                Math.abs(
                    this.vx
                );

        }


        if(
            this.x >
            W-this.radius
        ){

            this.x =
                W-this.radius;

            this.vx =
                -Math.abs(
                    this.vx
                );

        }

    }


    draw(){

        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.rotation
        );

        ctx.font =
            `${this.radius*2}px Arial`;

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.shadowColor =
            "rgba(255,40,0,.7)";

        ctx.shadowBlur =
            15;

        ctx.fillText(
            "💣",
            0,
            0
        );

        ctx.restore();

    }

}


/* =========================================================
   PIECES
========================================================= */

class Piece{

    constructor(
        fruit,
        side
    ){

        this.x =
            fruit.x;

        this.y =
            fruit.y;

        this.emoji =
            fruit.data.emoji;

        this.vx =
            side *
            random(
                3,
                6
            );

        this.vy =
            random(
                -5,
                -3
            );

        this.gravity =
            .25;

        this.rotation =
            fruit.rotation;

        this.rotationSpeed =
            side *
            random(
                .05,
                .12
            );

        this.life =
            1;

    }


    update(dt){

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            this.gravity *
            dt;

        this.rotation +=
            this.rotationSpeed *
            dt;

        this.life -=
            .018 *
            dt;

    }


    draw(){

        if(
            this.life <= 0
        )
            return;

        ctx.save();

        ctx.globalAlpha =
            this.life;

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.rotation
        );

        ctx.font =
            "70px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            this.emoji,
            0,
            0
        );

        ctx.restore();

    }

}


/* =========================================================
   PARTICLES
========================================================= */

class Particle{

    constructor(
        x,
        y,
        color
    ){

        this.x =
            x;

        this.y =
            y;

        this.vx =
            random(
                -8,
                8
            );

        this.vy =
            random(
                -8,
                8
            );

        this.size =
            random(
                2,
                6
            );

        this.color =
            color;

        this.life =
            1;

    }


    update(dt){

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            .22 *
            dt;

        this.life -=
            .035 *
            dt;

    }


    draw(){

        if(
            this.life <= 0
        )
            return;

        ctx.save();

        ctx.globalAlpha =
            this.life;

        ctx.fillStyle =
            this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }

}


/* =========================================================
   SLICE
========================================================= */

function sliceFruit(
    fruit
){

    if(
        settings.particles
    ){

        for(
            let i=0;
            i<25;
            i++
        ){

            particles.push(
                new Particle(
                    fruit.x,
                    fruit.y,
                    fruit.data.color
                )
            );

        }

    }


    pieces.push(
        new Piece(
            fruit,
            -1
        )
    );

    pieces.push(
        new Piece(
            fruit,
            1
        )
    );

    sliceSound();

}


/* =========================================================
   MOUSE
========================================================= */

let mouseX =
    -1000;

let mouseY =
    -1000;

let previousMouseX =
    -1000;

let previousMouseY =
    -1000;


window.addEventListener(
    "mousemove",
    e => {

        const newX =
            e.clientX;

        const newY =
            e.clientY;


        if(
            state ===
            "playing"
        ){

            const dx =
                newX -
                previousMouseX;

            const dy =
                newY -
                previousMouseY;

            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );

            const steps =
                Math.max(
                    1,
                    Math.ceil(
                        distance /
                        10
                    )
                );


            for(
                let i=1;
                i<=steps;
                i++
            ){

                const x =
                    previousMouseX +
                    dx *
                    (i/steps);

                const y =
                    previousMouseY +
                    dy *
                    (i/steps);

                checkSlice(
                    x,
                    y
                );


                if(
                    settings.trail
                ){

                    blade.push({
                        x:x,
                        y:y,
                        life:1
                    });

                }

            }

        }


        mouseX =
            newX;

        mouseY =
            newY;

        previousMouseX =
            newX;

        previousMouseY =
            newY;

    }
);


/* =========================================================
   SLICE CHECK
========================================================= */

function checkSlice(
    x,
    y
){

    if(
        state !==
        "playing"
    )
        return;


    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const fruit =
            fruits[i];

        const dx =
            x -
            fruit.x;

        const dy =
            y -
            fruit.y;

        const distance =
            Math.sqrt(
                dx*dx +
                dy*dy
            );


        if(
            distance <
            fruit.radius*1.15
        ){

            if(
                fruit instanceof Bomb
            ){

                bombExplode();

                return;

            }


            fruits.splice(
                i,
                1
            );

            score++;

            sliceFruit(
                fruit
            );

            addCombo();

        }

    }

}


/* =========================================================
   COMBO
========================================================= */

function addCombo(){

    combo++;

    comboTimer =
        55;


    if(
        combo>=2
    ){

        const bonus =
            Math.min(
                combo-1,
                10
            );

        score +=
            bonus;

        showCombo(
            combo +
            "x COMBO +" +
            bonus
        );

    }

    updateHUD();

}


function showCombo(
    text
){

    const element =
        document.getElementById(
            "combo"
        );

    element.textContent =
        text;

    element.classList.remove(
        "show"
    );

    void element.offsetWidth;

    element.classList.add(
        "show"
    );

}


/* =========================================================
   BOMB
========================================================= */

function bombExplode(){

    bombSound();

    if(
        settings.shake
    ){

        shake =
            25;

    }


    if(
        settings.particles
    ){

        for(
            let i=0;
            i<70;
            i++
        ){

            particles.push(
                new Particle(
                    mouseX,
                    mouseY,
                    Math.random()>.5
                        ? "#ff8c00"
                        : "#ff2222"
                )
            );

        }

    }

    endGame();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent =
        score;

    document.getElementById(
        "best"
    ).textContent =
        "BEST " + best;


    let hearts = "";

    for(
        let i=0;
        i<3;
        i++
    ){

        hearts +=
            i<lives
                ? "❤️"
                : "🖤";

    }


    document.getElementById(
        "lives"
    ).textContent =
        hearts;

}


/* =========================================================
   MISS
========================================================= */

function missFruit(
    fruit
){

    if(
        fruit instanceof Bomb
    )
        return;


    lives--;

    combo =
        0;

    comboTimer =
        0;

    updateHUD();


    if(
        lives<=0
    ){

        endGame();

    }

}


/* =========================================================
   SPAWN
========================================================= */

function spawnWave(){

    const level =
        Math.floor(
            score/15
        );

    let amount =
        1;


    if(
        Math.random() <
        .35 +
        level*.025
    ){

        amount =
            2;

    }


    if(
        level>=3 &&
        Math.random()<.25
    ){

        amount =
            3;

    }


    if(
        level>=7 &&
        Math.random()<.18
    ){

        amount =
            4;

    }


    amount =
        Math.min(
            amount,
            4
        );


    const bombChance =
        Math.min(
            .07 +
            level*.008,
            .15
        );


    for(
        let i=0;
        i<amount;
        i++
    ){

        if(
            Math.random() <
            bombChance
        ){

            fruits.push(
                new Bomb()
            );

        }
        else{

            fruits.push(
                new Fruit()
            );

        }

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(
    dt
){

    if(
        state !==
        "playing"
    )
        return;


    dt =
        Math.min(
            dt,
            1.5
        );


    spawnTimer -=
        dt;


    const level =
        Math.floor(
            score/15
        );


    const spawnRate =
        Math.max(
            48,
            75 -
            level*3
        );


    if(
        spawnTimer<=0
    ){

        spawnWave();

        spawnTimer =
            spawnRate;

    }


    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const fruit =
            fruits[i];

        fruit.update(
            dt
        );


        if(
            fruit.y >
            H+120
        ){

            fruits.splice(
                i,
                1
            );

            missFruit(
                fruit
            );

        }

    }


    for(
        let i=pieces.length-1;
        i>=0;
        i--
    ){

        pieces[i].update(
            dt
        );


        if(
            pieces[i].life<=0 ||
            pieces[i].y>H+150
        ){

            pieces.splice(
                i,
                1
            );

        }

    }


    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        particles[i].update(
            dt
        );


        if(
            particles[i].life<=0
        ){

            particles.splice(
                i,
                1
            );

        }

    }


    if(
        comboTimer>0
    ){

        comboTimer -=
            dt;

    }
    else{

        combo =
            0;

        document.getElementById(
            "combo"
        ).classList.remove(
            "show"
        );

    }


    for(
        let i=blade.length-1;
        i>=0;
        i--
    ){

        blade[i].life -=
            .09*dt;


        if(
            blade[i].life<=0
        ){

            blade.splice(
                i,
                1
            );

        }

    }


    if(
        shake>0
    ){

        shake -=
            1.5*dt;

        if(
            shake<0
        )
            shake=0;

    }

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#29351f"
    );

    gradient.addColorStop(
        .5,
        "#182315"
    );

    gradient.addColorStop(
        1,
        "#080d08"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    if(
        shake>0 &&
        settings.shake
    ){

        ctx.translate(
            random(
                -shake,
                shake
            ),
            random(
                -shake,
                shake
            )
        );

    }


    for(
        const fruit of fruits
    ){

        fruit.draw();

    }


    for(
        const piece of pieces
    ){

        piece.draw();

    }


    for(
        const particle of particles
    ){

        particle.draw();

    }


    /* BLADE */

    if(
        settings.trail &&
        blade.length>1
    ){

        ctx.save();

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.lineWidth =
            7;

        ctx.shadowColor =
            "white";

        ctx.shadowBlur =
            18;

        ctx.strokeStyle =
            "rgba(255,255,255,.95)";


        ctx.beginPath();


        for(
            let i=0;
            i<blade.length;
            i++
        ){

            const p =
                blade[i];


            if(
                i===0
            ){

                ctx.moveTo(
                    p.x,
                    p.y
                );

            }
            else{

                ctx.lineTo(
                    p.x,
                    p.y
                );

            }

        }


        ctx.stroke();

        ctx.restore();

    }


    /* MOUSE TIP */

    if(
        state==="playing"
    ){

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            mouseX,
            mouseY,
            4,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "white";

        ctx.shadowColor =
            "white";

        ctx.shadowBlur =
            15;

        ctx.fill();

        ctx.restore();

    }


    ctx.restore();

}


/* =========================================================
   LOOP
========================================================= */

function loop(
    now
){

    let dt =
        (now-lastTime) /
        16.6667;

    lastTime =
        now;


    dt =
        Math.min(
            dt,
            1.5
        );


    update(
        dt
    );

    draw();


    requestAnimationFrame(
        loop
    );

}


requestAnimationFrame(
    loop
);


/* =========================================================
   START
========================================================= */

function startGame(){

    initAudio();

    fruits=[];
    pieces=[];
    particles=[];
    blade=[];

    score=0;
    lives=3;
    combo=0;
    comboTimer=0;
    spawnTimer=10;
    shake=0;

    state=
        "playing";

    updateHUD();


    document.getElementById(
        "startScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "gameOver"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "pauseScreen"
    ).classList.add(
        "hidden"
    );

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    if(
        state==="gameover"
    )
        return;


    state=
        "gameover";


    const newBest =
        score>best;


    if(
        newBest
    ){

        best =
            score;

        localStorage.setItem(
            "fruitSliceBest",
            best
        );

    }


    document.getElementById(
        "finalScore"
    ).textContent =
        "Score: " + score;


    document.getElementById(
        "newBest"
    ).classList.toggle(
        "hidden",
        !newBest
    );


    document.getElementById(
        "gameOver"
    ).classList.remove(
        "hidden"
    );


    updateHUD();

}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(
        state!=="playing"
    )
        return;

    state=
        "paused";


    document.getElementById(
        "pauseScreen"
    ).classList.remove(
        "hidden"
    );

}


function resumeGame(){

    if(
        state!=="paused"
    )
        return;

    state=
        "playing";


    lastTime =
        performance.now();


    document.getElementById(
        "pauseScreen"
    ).classList.add(
        "hidden"
    );

}


/* =========================================================
   SETTINGS SYSTEM
========================================================= */

let settingsReturnTo =
    "menu";


function openSettings(
    returnScreen
){

    settingsReturnTo =
        returnScreen;


    /*
     * HIDE EVERYTHING ELSE
     */

    document.getElementById(
        "startScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "pauseScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "gameOver"
    ).classList.add(
        "hidden"
    );


    /*
     * SHOW ONLY SETTINGS
     */

    document.getElementById(
        "settingsScreen"
    ).classList.remove(
        "hidden"
    );

}


function closeSettings(){

    document.getElementById(
        "settingsScreen"
    ).classList.add(
        "hidden"
    );


    if(
        settingsReturnTo ===
        "menu"
    ){

        document.getElementById(
            "startScreen"
        ).classList.remove(
            "hidden"
        );

    }


    else if(
        settingsReturnTo ===
        "pause"
    ){

        document.getElementById(
            "pauseScreen"
        ).classList.remove(
            "hidden"
        );

    }


    else if(
        settingsReturnTo ===
        "gameover"
    ){

        document.getElementById(
            "gameOver"
        ).classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "playButton"
).onclick =
    startGame;


document.getElementById(
    "againButton"
).onclick =
    startGame;


document.getElementById(
    "settingsFromStart"
).onclick =
    () => {

        openSettings(
            "menu"
        );

    };


document.getElementById(
    "pauseSettings"
).onclick =
    () => {

        openSettings(
            "pause"
        );

    };


document.getElementById(
    "gameOverSettings"
).onclick =
    () => {

        openSettings(
            "gameover"
        );

    };


/* X BUTTON */

document.getElementById(
    "closeSettingsX"
).onclick =
    closeSettings;


/* RESUME */

document.getElementById(
    "resumeButton"
).onclick =
    resumeGame;


/* QUIT */

document.getElementById(
    "quitButton"
).onclick =
    () => {

        state =
            "menu";


        document.getElementById(
            "pauseScreen"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "startScreen"
        ).classList.remove(
            "hidden"
        );

    };


/* =========================================================
   FULLSCREEN
========================================================= */

document.getElementById(
    "fullscreenButton"
).onclick =
    async () => {

        try{

            if(
                !document.fullscreenElement
            ){

                await document
                    .documentElement
                    .requestFullscreen();

            }
            else{

                await document
                    .exitFullscreen();

            }

        }
        catch(error){

            console.log(
                "Fullscreen unavailable"
            );

        }

    };


/* =========================================================
   ESC = PAUSE / CLOSE SETTINGS
========================================================= */

window.addEventListener(
    "keydown",
    e => {

        if(
            e.key!=="Escape"
        )
            return;


        if(
            !document
                .getElementById(
                    "settingsScreen"
                )
                .classList
                .contains(
                    "hidden"
                )
        ){

            closeSettings();

            return;

        }


        if(
            state==="playing"
        ){

            pauseGame();

        }
        else if(
            state==="paused"
        ){

            resumeGame();

        }

    }
);
