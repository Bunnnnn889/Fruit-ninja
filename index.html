<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Fruit Ninja</title>


<style>

*{
  box-sizing:border-box;

  user-select:none;
  -webkit-user-select:none;

  -webkit-tap-highlight-color:transparent;
}


html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#111;
}


body::before{

  content:"";

  position:fixed;

  inset:0;

  background:

    linear-gradient(
      rgba(0,0,0,.25),
      rgba(0,0,0,.65)
    ),

    url("https://images.unsplash.com/photo-1523413651479-597eb2da0ad6?auto=format&fit=crop&w=2000&q=80");

  background-size:cover;

  background-position:center;

  z-index:-2;
}


body::after{

  content:"";

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.35);

  z-index:-1;
}


canvas{

  display:block;

  width:100%;
  height:100%;

  cursor:none;
}


/* =========================
   HUD
========================= */

#hud{

  position:fixed;

  top:15px;

  left:20px;
  right:20px;

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  color:white;

  pointer-events:none;

  z-index:5;
}


#score{

  font-size:32px;

  font-weight:bold;

  text-shadow:
    0 3px 8px #000;
}


#highScore{

  font-size:16px;

  opacity:.85;

  margin-top:3px;
}


#lives{

  font-size:30px;

  letter-spacing:5px;

  text-shadow:
    0 3px 8px #000;
}


/* =========================
   COMBO
========================= */

#combo{

  position:fixed;

  top:100px;

  left:50%;

  transform:
    translateX(-50%)
    scale(.5);

  color:white;

  font-size:42px;

  font-weight:bold;

  font-style:italic;

  text-shadow:
    0 0 8px #ffb300,
    0 3px 8px #000;

  opacity:0;

  pointer-events:none;

  z-index:10;

  transition:
    transform .15s,
    opacity .15s;
}


#combo.show{

  opacity:1;

  transform:
    translateX(-50%)
    scale(1);
}


/* =========================
   START SCREEN
========================= */

#startScreen{

  position:fixed;

  inset:0;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  background:
    rgba(0,0,0,.55);

  color:white;

  z-index:15;

  text-align:center;
}


#startScreen h1{

  font-size:80px;

  margin:0;

  font-style:italic;

  text-shadow:
    0 0 25px orange,
    0 5px 10px #000;
}


#startScreen p{

  font-size:20px;

  opacity:.9;
}


/* =========================
   GAME OVER
========================= */

#gameOver{

  position:fixed;

  inset:0;

  display:none;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  background:
    rgba(0,0,0,.78);

  color:white;

  z-index:20;

  text-align:center;
}


#gameOver h1{

  margin:0 0 10px;

  font-size:72px;

  letter-spacing:4px;

  text-shadow:
    0 0 20px red;
}


#gameOver p{

  font-size:25px;

  margin:8px;
}


#newHigh{

  color:#ffd43b;

  font-size:25px;

  font-weight:bold;

  display:none;
}


/* =========================
   BUTTON
========================= */

button{

  margin-top:25px;

  padding:15px 38px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      #ffcf33,
      #ff941f
    );

  color:#321500;

  font-size:22px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.4);
}


button:hover{

  transform:scale(1.05);
}


.hidden{

  display:none !important;
}

</style>

</head>


<body>


<!-- =========================
     HUD
========================= -->

<div id="hud">

  <div>

    <div id="score">
      Score: 0
    </div>

    <div id="highScore">
      Best: 0
    </div>

  </div>


  <div id="lives">
    ❤️❤️❤️
  </div>

</div>


<div id="combo"></div>


<!-- =========================
     START
========================= -->

<div id="startScreen">

  <h1>
    FRUIT NINJA
  </h1>

  <p>
    Slice the fruit. Avoid the bombs.
  </p>

  <p>
    Hold your mouse button and drag to slash.
  </p>

  <button id="startButton">
    START GAME
  </button>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver">

  <h1>
    GAME OVER
  </h1>

  <p id="finalScore">
    Score: 0
  </p>

  <p id="finalBest">
    Best: 0
  </p>

  <p id="newHigh">
    NEW HIGH SCORE!
  </p>

  <button id="restartButton">
    PLAY AGAIN
  </button>

</div>


<canvas id="game"></canvas>


<script>


/* =========================
   CANVAS
========================= */

const canvas =
  document.getElementById(
    "game"
  );

const ctx =
  canvas.getContext(
    "2d"
  );


/* =========================
   VARIABLES
========================= */

let fruits=[];

let slicedFruits=[];

let particles=[];

let bladeTrail=[];


let score=0;

let lives=3;

let running=false;


let combo=0;

let comboTimer=0;


let spawnTimer=0;

let lastTime=
  performance.now();


let mouseX=0;

let mouseY=0;

let mouseDown=false;


let highScore=
  Number(
    localStorage.getItem(
      "fruitNinjaHighScore"
    )
  ) || 0;


document
  .getElementById(
    "highScore"
  )
  .textContent=
    "Best: "+highScore;


/* =========================
   RESIZE
========================= */

function resize(){

  canvas.width=
    window.innerWidth;

  canvas.height=
    window.innerHeight;

}


resize();


window.addEventListener(
  "resize",
  resize
);


/* =========================
   FRUIT TYPES
========================= */

const fruitTypes=[

  {
    emoji:"🍎",
    color:"#e53935"
  },

  {
    emoji:"🍊",
    color:"#ff9800"
  },

  {
    emoji:"🍌",
    color:"#ffd600"
  },

  {
    emoji:"🍉",
    color:"#43a047"
  },

  {
    emoji:"🍇",
    color:"#8e44ad"
  },

  {
    emoji:"🍍",
    color:"#f5c542"
  },

  {
    emoji:"🥝",
    color:"#7cb342"
  },

  {
    emoji:"🍑",
    color:"#ff8a65"
  }

];


/* =========================
   DIFFICULTY
========================= */

function difficulty(){

  return Math.floor(
    score/10
  );

}


/* =========================
   VERY HIGH RANDOM
   LAUNCH SYSTEM
========================= */

function getLaunchVelocity(){

  const roll=
    Math.random();


  /*
    15% HIGH
  */

  if(
    roll < .15
  ){

    return (
      16 +
      Math.random()*3
    );

  }


  /*
    30% VERY HIGH
  */

  if(
    roll < .45
  ){

    return (
      19 +
      Math.random()*4
    );

  }


  /*
    35% EXTREMELY HIGH
  */

  if(
    roll < .80
  ){

    return (
      22 +
      Math.random()*5
    );

  }


  /*
    20% SUPER HIGH
  */

  return (
    26 +
    Math.random()*6
  );

}


/* =========================
   FRUIT
========================= */

class Fruit{

  constructor(){

    /*
      RANDOM START
    */

    this.x=
      canvas.width *
      (
        .07+
        Math.random()*.86
      );


    /*
      START BELOW SCREEN
    */

    this.y=
      canvas.height+
      50+
      Math.random()*100;


    /*
      RANDOM SIZE
    */

    this.size=
      58+
      Math.random()*18;


    /*
      RANDOM LEFT/RIGHT
    */

    this.vx=
      (
        Math.random()-.5
      )*
      (
        3+
        Math.random()*6
      );


    /*
      HIGH RANDOM JUMP
    */

    this.vy=
      -(
        getLaunchVelocity()+
        difficulty()*.10
      );


    /*
      RANDOM ROTATION
    */

    this.rotation=
      Math.random()*
      Math.PI*
      2;


    this.rotationSpeed=
      (
        Math.random()-.5
      )*
      (
        .05+
        Math.random()*.09
      );


    /*
      RANDOM FRUIT
    */

    this.type=
      fruitTypes[
        Math.floor(
          Math.random()*
          fruitTypes.length
        )
      ];


    this.dead=false;

  }


  update(dt){

    this.x+=
      this.vx*dt;


    this.y+=
      this.vy*dt;


    /*
      LOWER GRAVITY

      This keeps fruits
      in the air longer.
    */

    this.vy+=
      .30*dt;


    this.rotation+=
      this.rotationSpeed*dt;


    /*
      SIDE WALLS
    */

    if(
      this.x<
      this.size
    ){

      this.x=
        this.size;

      this.vx*=-1;

    }


    if(
      this.x>
      canvas.width-
      this.size
    ){

      this.x=
        canvas.width-
        this.size;

      this.vx*=-1;

    }

  }


  draw(){

    ctx.save();


    ctx.translate(
      this.x,
      this.y
    );


    ctx.rotate(
      this.rotation
    );


    ctx.font=
      this.size+
      "px Arial";


    ctx.textAlign=
      "center";


    ctx.textBaseline=
      "middle";


    ctx.shadowColor=
      "rgba(255,255,255,.5)";


    ctx.shadowBlur=10;


    ctx.fillText(
      this.type.emoji,
      0,
      0
    );


    ctx.restore();

  }

}


/* =========================
   BOMB
========================= */

class Bomb{

  constructor(){

    this.x=
      canvas.width*
      (
        .07+
        Math.random()*.86
      );


    this.y=
      canvas.height+
      50+
      Math.random()*100;


    this.size=
      55+
      Math.random()*12;


    this.vx=
      (
        Math.random()-.5
      )*
      (
        3+
        Math.random()*6
      );


    this.vy=
      -(
        getLaunchVelocity()+
        difficulty()*.10
      );


    this.rotation=
      Math.random()*
      Math.PI*
      2;


    this.rotationSpeed=
      (
        Math.random()-.5
      )*.1;


    this.dead=false;

  }


  update(dt){

    this.x+=
      this.vx*dt;


    this.y+=
      this.vy*dt;


    this.vy+=
      .30*dt;


    this.rotation+=
      this.rotationSpeed*dt;


    if(
      this.x<
      this.size
    ){

      this.x=
        this.size;

      this.vx*=-1;

    }


    if(
      this.x>
      canvas.width-
      this.size
    ){

      this.x=
        canvas.width-
        this.size;

      this.vx*=-1;

    }

  }


  draw(){

    ctx.save();


    ctx.translate(
      this.x,
      this.y
    );


    ctx.rotate(
      this.rotation
    );


    ctx.font=
      this.size+
      "px Arial";


    ctx.textAlign=
      "center";


    ctx.textBaseline=
      "middle";


    ctx.shadowColor=
      "red";


    ctx.shadowBlur=15;


    ctx.fillText(
      "💣",
      0,
      0
    );


    ctx.restore();

  }

}


/* =========================
   SLICED FRUIT HALF
========================= */

class FruitHalf{

  constructor(
    x,
    y,
    emoji,
    side
  ){

    this.x=x;

    this.y=y;

    this.emoji=
      emoji;


    this.vx=
      side*
      (
        2+
        Math.random()*3
      );


    this.vy=
      -(
        2+
        Math.random()*3
      );


    this.rotation=
      Math.random()*
      Math.PI;


    this.rotationSpeed=
      side*
      (
        .05+
        Math.random()*.06
      );


    this.life=1;

  }


  update(dt){

    this.x+=
      this.vx*dt;


    this.y+=
      this.vy*dt;


    this.vy+=
      .32*dt;


    this.rotation+=
      this.rotationSpeed*dt;


    this.life-=
      .018*dt;

  }


  draw(){

    if(
      this.life<=0
    )
      return;


    ctx.save();


    ctx.globalAlpha=
      this.life;


    ctx.translate(
      this.x,
      this.y
    );


    ctx.rotate(
      this.rotation
    );


    ctx.font=
      "55px Arial";


    ctx.textAlign=
      "center";


    ctx.textBaseline=
      "middle";


    ctx.fillText(
      this.emoji,
      0,
      0
    );


    ctx.restore();

  }

}


/* =========================
   PARTICLE
========================= */

class Particle{

  constructor(
    x,
    y,
    color
  ){

    this.x=x;

    this.y=y;


    this.vx=
      (
        Math.random()-.5
      )*10;


    this.vy=
      (
        Math.random()-.5
      )*10;


    this.life=1;


    this.size=
      2+
      Math.random()*5;


    this.color=
      color;

  }


  update(dt){

    this.x+=
      this.vx*dt;


    this.y+=
      this.vy*dt;


    this.vy+=
      .2*dt;


    this.life-=
      .035*dt;

  }


  draw(){

    if(
      this.life<=0
    )
      return;


    ctx.save();


    ctx.globalAlpha=
      this.life;


    ctx.fillStyle=
      this.color;


    ctx.beginPath();


    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );


    ctx.fill();


    ctx.restore();

  }

}


/* =========================
   JUICE PARTICLES
========================= */

function createParticles(
  fruit
){

  for(
    let i=0;
    i<25;
    i++
  ){

    particles.push(
      new Particle(
        fruit.x,
        fruit.y,
        fruit.type.color
      )
    );

  }

}


/* =========================
   SPAWN WAVE
========================= */

function spawnWave(){

  let amount=1;


  /*
    More fruits later.
  */

  if(
    Math.random()<
    Math.min(
      .20+
      difficulty()*.03,
      .55
    )
  ){

    amount=2;

  }


  if(
    difficulty()>=3 &&
    Math.random()<.25
  ){

    amount=3;

  }


  if(
    difficulty()>=7 &&
    Math.random()<.18
  ){

    amount=4;

  }


  for(
    let i=0;
    i<amount;
    i++
  ){

    /*
      Bomb chance.
    */

    const bombChance=
      Math.min(
        .07+
        difficulty()*.006,
        .16
      );


    if(
      Math.random()<
      bombChance
    ){

      fruits.push(
        new Bomb()
      );

    }else{

      fruits.push(
        new Fruit()
      );

    }

  }

}


/* =========================
   SLICE
========================= */

function slice(
  x,
  y
){

  if(
    !running
  )
    return;


  let slicedSomething=
    false;


  for(
    let i=
      fruits.length-1;
    i>=0;
    i--
  ){

    const f=
      fruits[i];


    if(
      f.dead
    )
      continue;


    const dx=
      f.x-x;


    const dy=
      f.y-y;


    const distance=
      Math.sqrt(
        dx*dx+
        dy*dy
      );


    if(
      distance<
      f.size*.55
    ){

      /*
        BOMB
      */

      if(
        f instanceof Bomb
      ){

        bombHit();

        return;

      }


      /*
        FRUIT
      */

      f.dead=
        true;


      score++;


      slicedSomething=
        true;


      document
        .getElementById(
          "score"
        )
        .textContent=
          "Score: "+
          score;


      createParticles(
        f
      );


      /*
        LEFT HALF
      */

      slicedFruits.push(
        new FruitHalf(
          f.x,
          f.y,
          f.type.emoji,
          -1
        )
      );


      /*
        RIGHT HALF
      */

      slicedFruits.push(
        new FruitHalf(
          f.x,
          f.y,
          f.type.emoji,
          1
        )
      );


      updateCombo();


      fruits.splice(
        i,
        1
      );

    }

  }


  /*
    Hitting nothing
    does NOT hurt you.
  */

  if(
    slicedSomething
  ){

    bladeTrail.push({
      x:x,
      y:y,
      life:1
    });

  }

}


/* =========================
   COMBO
========================= */

function updateCombo(){

  combo++;

  comboTimer=
    70;


  if(
    combo>=2
  ){

    const multiplier=
      Math.min(
        combo,
        5
      );


    const bonus=
      multiplier-1;


    score+=
      bonus;


    document
      .getElementById(
        "score"
      )
      .textContent=
        "Score: "+
        score;


    showCombo(
      combo+
      "x COMBO!"
    );

  }

}


function showCombo(
  text
){

  const element=
    document.getElementById(
      "combo"
    );


  element.textContent=
    text;


  element.classList.remove(
    "show"
  );


  void element.offsetWidth;


  element.classList.add(
    "show"
  );

}


/* =========================
   BOMB HIT
========================= */

function bombHit(){

  running=false;


  for(
    let i=0;
    i<70;
    i++
  ){

    particles.push(
      new Particle(
        mouseX,
        mouseY,
        Math.random()<.5
          ? "orange"
          : "red"
      )
    );

  }


  setTimeout(
    endGame,
    350
  );

}


/* =========================
   LOSE LIFE
========================= */

function loseLife(){

  lives--;


  updateLives();


  if(
    lives<=0
  ){

    endGame();

  }

}


/* =========================
   UPDATE LIVES
========================= */

function updateLives(){

  let text="";


  for(
    let i=0;
    i<3;
    i++
  ){

    text+=
      i<lives
      ? "❤️"
      : "🖤";

  }


  document
    .getElementById(
      "lives"
    )
    .textContent=
      text;

}


/* =========================
   BLADE
========================= */

function drawBlade(){

  if(
    bladeTrail.length<2
  )
    return;


  ctx.save();


  ctx.lineWidth=5;

  ctx.lineCap=
    "round";


  ctx.shadowColor=
    "white";


  ctx.shadowBlur=
    15;


  ctx.beginPath();


  for(
    let i=0;
    i<bladeTrail.length;
    i++
  ){

    const p=
      bladeTrail[i];


    if(
      i===0
    ){

      ctx.moveTo(
        p.x,
        p.y
      );

    }else{

      ctx.lineTo(
        p.x,
        p.y
      );

    }

  }


  ctx.strokeStyle=
    "rgba(255,255,255,.9)";


  ctx.stroke();


  ctx.restore();

}


/* =========================
   UPDATE BLADE
========================= */

function updateBlade(
  dt
){

  for(
    let i=
      bladeTrail.length-1;
    i>=0;
    i--
  ){

    bladeTrail[i].life-=
      .08*dt;


    if(
      bladeTrail[i].life<=0
    ){

      bladeTrail.splice(
        i,
        1
      );

    }

  }

}


/* =========================
   GAME LOOP
========================= */

function animate(
  now
){

  const dt=
    Math.min(
      (now-lastTime)/
      16.67,
      2
    );


  lastTime=
    now;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(
    running
  ){

    /*
      SPAWN TIMER
    */

    spawnTimer-=
      dt;


    const spawnRate=
      Math.max(
        45,
        75-
        difficulty()*3
      );


    if(
      spawnTimer<=0
    ){

      spawnWave();


      spawnTimer=
        spawnRate;

    }


    /*
      FRUITS + BOMBS
    */

    for(
      let i=
        fruits.length-1;
      i>=0;
      i--
    ){

      const f=
        fruits[i];


      f.update(dt);


      f.draw();


      /*
        Missed object.
      */

      if(
        f.y>
        canvas.height+
        130
      ){

        fruits.splice(
          i,
          1
        );


        /*
          ONLY MISSED
          NORMAL FRUITS
          COST A LIFE.

          Missing a bomb
          does NOT cost a life.
        */

        if(
          f instanceof Fruit
        ){

          loseLife();

        }

      }

    }


    /*
      SLICED FRUIT HALVES
    */

    for(
      let i=
        slicedFruits.length-1;
      i>=0;
      i--
    ){

      const half=
        slicedFruits[i];


      half.update(dt);


      half.draw();


      if(
        half.life<=0 ||
        half.y>
        canvas.height+
        150
      ){

        slicedFruits.splice(
          i,
          1
        );

      }

    }


    /*
      PARTICLES
    */

    for(
      let i=
        particles.length-1;
      i>=0;
      i--
    ){

      const p=
        particles[i];


      p.update(dt);


      p.draw();


      if(
        p.life<=0
      ){

        particles.splice(
          i,
          1
        );

      }

    }


    /*
      COMBO
    */

    if(
      comboTimer>0
    ){

      comboTimer-=
        dt;

    }else{

      combo=0;


      document
        .getElementById(
          "combo"
        )
        .classList.remove(
          "show"
        );

    }


    updateBlade(
      dt
    );

  }


  /*
    DRAW BLADE
  */

  drawBlade();


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);


/* =========================
   MOUSE
========================= */

canvas.addEventListener(
  "mousedown",
  e=>{

    mouseDown=
      true;


    mouseX=
      e.clientX;


    mouseY=
      e.clientY;


    slice(
      mouseX,
      mouseY
    );

  }
);


canvas.addEventListener(
  "mouseup",
  ()=>{

    mouseDown=
      false;

  }
);


canvas.addEventListener(
  "mouseleave",
  ()=>{

    mouseDown=
      false;

  }
);


canvas.addEventListener(
  "mousemove",
  e=>{

    mouseX=
      e.clientX;


    mouseY=
      e.clientY;


    if(
      mouseDown &&
      running
    ){

      bladeTrail.push({
        x:mouseX,
        y:mouseY,
        life:1
      });


      slice(
        mouseX,
        mouseY
      );

    }

  }
);


/* =========================
   TOUCH
========================= */

canvas.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();


    const t=
      e.touches[0];


    mouseX=
      t.clientX;


    mouseY=
      t.clientY;


    bladeTrail.push({
      x:mouseX,
      y:mouseY,
      life:1
    });


    slice(
      mouseX,
      mouseY
    );

  },
  {
    passive:false
  }
);


canvas.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();


    const t=
      e.touches[0];


    mouseX=
      t.clientX;


    mouseY=
      t.clientY;


    bladeTrail.push({
      x:mouseX,
      y:mouseY,
      life:1
    });


    slice(
      mouseX,
      mouseY
    );

  },
  {
    passive:false
  }
);


/* =========================
   START GAME
========================= */

function startGame(){

  fruits=[];

  slicedFruits=[];

  particles=[];

  bladeTrail=[];


  score=0;

  lives=3;

  combo=0;

  comboTimer=0;

  spawnTimer=0;


  running=
    true;


  document
    .getElementById(
      "score"
    )
    .textContent=
      "Score: 0";


  updateLives();


  document
    .getElementById(
      "combo"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "startScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "gameOver"
    )
    .style.display=
      "none";


  lastTime=
    performance.now();

}


/* =========================
   START BUTTON
========================= */

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startGame
  );


/* =========================
   GAME OVER
========================= */

function endGame(){

  if(
    document
      .getElementById(
        "gameOver"
      )
      .style.display===
      "flex"
  ){

    return;

  }


  running=
    false;


  /*
    HIGH SCORE ONLY
    SAVES THE SCORE.

    It cannot trigger
    game over.
  */

  const isNewHigh=
    score>
    highScore;


  if(
    isNewHigh
  ){

    highScore=
      score;


    localStorage.setItem(
      "fruitNinjaHighScore",
      highScore
    );

  }


  document
    .getElementById(
      "finalScore"
    )
    .textContent=
      "Score: "+
      score;


  document
    .getElementById(
      "finalBest"
    )
    .textContent=
      "Best: "+
      highScore;


  document
    .getElementById(
      "newHigh"
    )
    .style.display=
      isNewHigh
      ? "block"
      : "none";


  document
    .getElementById(
      "gameOver"
    )
    .style.display=
      "flex";

}


/* =========================
   RESTART
========================= */

document
  .getElementById(
    "restartButton"
  )
  .addEventListener(
    "click",
    startGame
  );


/* =========================
   PREVENT SCROLLING
========================= */

document.body.addEventListener(
  "touchmove",
  e=>{
    e.preventDefault();
  },
  {
    passive:false
  }
);

</script>
